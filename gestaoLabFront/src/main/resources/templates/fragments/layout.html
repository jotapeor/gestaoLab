<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <th:block th:fragment="head-content">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link th:href="@{/css/gestaolab.css}" rel="stylesheet">
        <style>
            body { font-family: 'Inter', sans-serif !important; }
            .gl-nav-sublist { list-style:none; padding:0; margin:0; max-height:0; overflow:hidden; transition:max-height 0.35s cubic-bezier(0.4,0,0.2,1); }
            .gl-nav-sublist.open { max-height:300px; }
        </style>
    </th:block>
</head>
<body>
<aside th:fragment="sidebar" class="gl-sidebar" id="glSidebar" aria-label="Menu de navegação">
    <a th:href="@{/dashboard}" class="gl-sidebar-brand">
        <span class="gl-sidebar-brand-text">Gestão<span>Lab</span></span>
    </a>
    <nav class="gl-sidebar-nav">
        <ul style="list-style:none;padding:0;margin:0;">
            <li class="gl-nav-item">
                <a th:href="@{/dashboard}" class="gl-nav-link" id="nav-dashboard">
                    <i class="bi bi-speedometer2"></i><span>Dashboard</span>
                </a>
            </li>
            <li><p class="gl-nav-label">Gestão</p></li>
            <li class="gl-nav-item">
                <a th:href="@{/em-construcao}" class="gl-nav-link" id="nav-usuarios">
                    <i class="bi bi-people"></i><span>Usuários</span>
                </a>
            </li>
            <li class="gl-nav-item">
                <a th:href="@{/em-construcao}" class="gl-nav-link" id="nav-uso">
                    <i class="bi bi-calendar-check"></i><span>Uso do Laboratório</span>
                </a>
            </li>
            <li class="gl-nav-item">
                <a th:href="@{/em-construcao}" class="gl-nav-link" id="nav-materiais">
                    <i class="bi bi-boxes"></i><span>Materiais</span>
                </a>
            </li>
            <li class="gl-nav-item">
                <a th:href="@{/em-construcao}" class="gl-nav-link" id="nav-equipamentos">
                    <i class="bi bi-tools"></i><span>Equipamentos</span>
                </a>
            </li>
            <li class="gl-nav-item">
                <a th:href="@{/em-construcao}" class="gl-nav-link" id="nav-relatorios">
                    <i class="bi bi-graph-up"></i><span>Relatórios</span>
                </a>
            </li>
        </ul>
    </nav>
    <div class="gl-sidebar-footer">
        <div class="gl-sidebar-user-name" th:text="${session.nome ?: 'Usuário'}">Usuário</div>
        <div class="gl-sidebar-user-role"
             th:text="${session.perfil == 'COORDENADOR' ? 'Coordenador' : (session.perfil == 'PROFESSOR' ? 'Professor' : 'Usuário')}">
            Usuário
        </div>
    </div>
</aside>

<header th:fragment="topbar(pageTitle)" class="gl-topbar">
    <button class="gl-topbar-toggle" id="sidebarToggle" aria-label="Abrir menu"><i class="bi bi-list"></i></button>
    <span class="gl-topbar-title" th:text="${pageTitle}">GestãoLab</span>
    <div class="gl-topbar-spacer"></div>
    <div class="gl-topbar-user">
        <i class="bi bi-person-circle"></i>
        <span th:text="${session.nome ?: 'Usuário'}">Usuário</span>
        <span class="gl-topbar-role"
              th:text="${'(' + (session.perfil == 'COORDENADOR' ? 'Coordenador' : (session.perfil == 'PROFESSOR' ? 'Professor' : 'Usuário')) + ')'}">
            (Usuário)
        </span>
        <a th:href="@{/logout}" class="gl-topbar-logout" title="Sair"><i class="bi bi-box-arrow-right"></i></a>
    </div>
</header>

<footer th:fragment="footer" class="gl-footer">
    <span>&copy; 2026 <strong>GestãoLab</strong></span>
    <span>v1.0.0</span>
</footer>

<th:block th:fragment="scripts">
    <input type="hidden" id="toast-success-message" th:if="${mensagemSucesso != null}" th:value="${mensagemSucesso}"/>
    <input type="hidden" id="toast-error-message" th:if="${errorMessage != null}" th:value="${errorMessage}"/>
    <script th:src="@{/js/gestaolab.js}"></script>
</th:block>
</body>
</html>
