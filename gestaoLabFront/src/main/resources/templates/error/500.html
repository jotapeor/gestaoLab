<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestãoLab — Erro interno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/gestaolab.css}" rel="stylesheet">
    <style>
        .gl-error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--gl-bg); padding: 24px; }
        .gl-error-card { background: var(--gl-surface); border: 1px solid var(--gl-border); border-radius: var(--gl-radius); box-shadow: 0 1px 4px rgba(15,23,42,.05); max-width: 480px; width: 100%; padding: 48px 40px; text-align: center; }
        .gl-error-code { font-size: 5rem; font-weight: 700; color: var(--gl-danger); line-height: 1; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
        .gl-error-title { font-size: 1.35rem; font-weight: 600; color: var(--gl-text); margin-bottom: 12px; }
        .gl-error-msg { color: var(--gl-text-secondary); margin-bottom: 32px; line-height: 1.6; }
    </style>
</head>
<body>
<div class="gl-error-page">
    <div class="gl-error-card">
        <div class="gl-error-code">500</div>
        <h1 class="gl-error-title">Erro interno do servidor</h1>
        <p class="gl-error-msg">
            Algo deu errado do nosso lado. O erro foi registrado
            e será investigado. Por favor, tente novamente em instantes.
        </p>
        <a href="/dashboard" class="btn btn-primary">
            <i class="bi bi-house" aria-hidden="true"></i> Voltar ao Dashboard
        </a>
    </div>
</div>
</body>
</html>
