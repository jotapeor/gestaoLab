<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GestãoLab — Acesso Negado</title>
    <th:block th:replace="~{fragments/layout :: head-content}"></th:block>
</head>
<body>
<div class="gl-sidebar-overlay" id="sidebarOverlay"></div>
<div class="gl-wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="gl-main">
        <div th:replace="~{fragments/layout :: topbar('Acesso Negado')}"></div>
        <main class="gl-content" id="main-content">
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
                        min-height:60vh;text-align:center;">
                <div style="font-size:4rem;color:var(--gl-danger);margin-bottom:16px;">
                    <i class="bi bi-shield-x" aria-hidden="true"></i>
                </div>
                <h1 class="gl-page-title" style="margin-bottom:8px;">Acesso Negado</h1>
                <p style="color:var(--gl-text-secondary);margin-bottom:24px;max-width:400px;">
                    Você não tem permissão para acessar esta página. Entre em contato com o coordenador
                    caso precise de acesso.
                </p>
                <a th:href="@{/dashboard}" class="btn btn-primary">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i> Voltar ao Dashboard
                </a>
            </div>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
