<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title th:text="${edicao} ? 'GestãoLab — Editar Laboratório' : 'GestãoLab — Novo Laboratório'">GestãoLab</title>
    <th:block th:replace="~{fragments/layout :: head-content}"></th:block>
</head>
<body>
<div class="gl-sidebar-overlay" id="sidebarOverlay"></div>
<div class="gl-wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="gl-main">
        <div th:replace="~{fragments/layout :: topbar(${edicao} ? 'Editar Laboratório' : 'Novo Laboratório')}"></div>
        <main class="gl-content" id="main-content">
            <div class="gl-page-header fade-in">
                <h1 class="gl-page-title"
                    th:text="${edicao} ? 'Editar Laboratório' : 'Novo Laboratório'">Laboratório</h1>
            </div>

            <div th:if="${formError}" class="gl-alert gl-alert-danger" role="alert">
                <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                <span th:text="${formError}">Erro.</span>
            </div>

            <div class="gl-card fade-in" style="max-width:520px;">
                <div class="gl-card-body">
                    <form th:action="${edicao} ? @{/laboratorios/editar/{id}(id=${laboratorio.id})} : @{/laboratorios/salvar}"
                          method="post">
                        <div class="gl-form-group">
                            <label class="gl-form-label" for="nome">
                                Nome <span class="required">*</span>
                            </label>
                            <input type="text" id="nome" name="nome" class="gl-form-control"
                                   th:value="${formNome ?: laboratorio?.nome}"
                                   maxlength="150" required placeholder="Nome do laboratório">
                        </div>
                        <div class="gl-form-group">
                            <label class="gl-form-label" for="localizacao">Localização</label>
                            <input type="text" id="localizacao" name="localizacao" class="gl-form-control"
                                   th:value="${formLocalizacao ?: laboratorio?.localizacao}"
                                   placeholder="Ex.: Bloco A, 2º andar">
                        </div>
                        <div class="gl-form-group">
                            <label class="gl-form-label" for="capacidadeStr">Capacidade</label>
                            <input type="number" id="capacidadeStr" name="capacidadeStr" class="gl-form-control gl-mono"
                                   th:value="${formCapacidade ?: laboratorio?.capacidade}"
                                   min="1" placeholder="Número de vagas">
                            <span class="gl-form-hint">Deixe em branco se não houver limite definido.</span>
                        </div>
                        <div style="display:flex;gap:10px;margin-top:8px;">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg" aria-hidden="true"></i>
                                <span th:text="${edicao} ? 'Salvar alterações' : 'Cadastrar'">Salvar</span>
                            </button>
                            <a th:href="@{/laboratorios}" class="btn btn-outline">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
