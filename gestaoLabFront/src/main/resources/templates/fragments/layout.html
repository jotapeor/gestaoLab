<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <th:block th:fragment="head-content">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,400&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link th:href="@{/css/gestaolab.css}" rel="stylesheet">
    </th:block>
</head>
<body>
<aside th:fragment="sidebar" class="gl-sidebar" id="glSidebar" aria-label="Menu de navegação">
    <a th:href="@{/dashboard}" class="gl-sidebar-brand">
        <span class="gl-sidebar-brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M9 3h6M10 3v7.5L4.5 18A2 2 0 0 0 6.3 21h11.4a2 2 0 0 0 1.8-3L14 10.5V3" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="9.5" cy="17.5" r="1" fill="currentColor"/>
                <circle cx="14" cy="16" r=".75" fill="currentColor"/>
            </svg>
        </span>
        <span class="gl-sidebar-brand-text">Gestão<span>Lab</span></span>
    </a>
    <nav class="gl-sidebar-nav">
        <ul style="list-style:none;padding:0;margin:0;">
            <li class="gl-nav-item">
                <a th:href="@{/dashboard}"
                   class="gl-nav-link"
                   title="Dashboard"
                   th:classappend="${menuAtivo == 'dashboard'} ? ' active' : ''">
                    <i class="bi bi-grid-1x2" aria-hidden="true"></i><span>Dashboard</span>
                </a>
            </li>
            <li><p class="gl-nav-label">Gestão</p></li>
            <li class="gl-nav-item"
                th:if="${session.perfil == 'COORDENADOR' or session.perfil == 'PROFESSOR'}">
                <a th:href="@{/usuarios}"
                   class="gl-nav-link"
                   title="Usuários"
                   th:classappend="${menuAtivo == 'usuarios'} ? ' active' : ''">
                    <i class="bi bi-people" aria-hidden="true"></i><span>Usuários</span>
                </a>
            </li>
            <li class="gl-nav-item">
                <a th:href="@{/projetos}"
                   class="gl-nav-link"
                   title="Projetos"
                   th:classappend="${menuAtivo == 'projetos'} ? ' active' : ''">
                    <i class="bi bi-journal-text" aria-hidden="true"></i><span>Projetos</span>
                </a>
            </li>
            <li class="gl-nav-item">
                <a th:href="@{/reservas}"
                   class="gl-nav-link"
                   title="Reservas"
                   th:classappend="${menuAtivo == 'reservas'} ? ' active' : ''">
                    <i class="bi bi-calendar2-check" aria-hidden="true"></i><span>Reservas</span>
                </a>
            </li>
            <li class="gl-nav-item">
                <a th:href="@{/uso-laboratorio}"
                   class="gl-nav-link"
                   title="Uso do Laboratório"
                   th:classappend="${menuAtivo == 'uso-laboratorio'} ? ' active' : ''">
                    <i class="bi bi-clipboard2-pulse" aria-hidden="true"></i><span>Uso do Laboratório</span>
                </a>
            </li>
            <li class="gl-nav-item">
                <a th:href="@{/materiais}"
                   class="gl-nav-link"
                   title="Materiais"
                   th:classappend="${menuAtivo == 'materiais'} ? ' active' : ''">
                    <i class="bi bi-eyedropper" aria-hidden="true"></i><span>Materiais</span>
                </a>
            </li>
            <li class="gl-nav-item">
                <a th:href="@{/equipamentos}"
                   class="gl-nav-link"
                   title="Equipamentos"
                   th:classappend="${menuAtivo == 'equipamentos'} ? ' active' : ''">
                    <i class="bi bi-thermometer" aria-hidden="true"></i><span>Equipamentos</span>
                </a>
            </li>
            <li class="gl-nav-item">
                <a th:href="@{/relatorios}"
                   class="gl-nav-link"
                   title="Relatórios"
                   th:classappend="${menuAtivo == 'relatorios'} ? ' active' : ''">
                    <i class="bi bi-activity" aria-hidden="true"></i><span>Relatórios</span>
                </a>
            </li>
            <li th:if="${session.perfil == 'COORDENADOR'}"><p class="gl-nav-label">Configurações</p></li>
            <li class="gl-nav-item" th:if="${session.perfil == 'COORDENADOR'}">
                <a th:href="@{/cursos-setores}"
                   class="gl-nav-link"
                   title="Cursos e Setores"
                   th:classappend="${menuAtivo == 'cursos-setores'} ? ' active' : ''">
                    <i class="bi bi-journal-bookmark" aria-hidden="true"></i><span>Cursos e Setores</span>
                </a>
            </li>
            <li class="gl-nav-item" th:if="${session.perfil == 'COORDENADOR'}">
                <a th:href="@{/laboratorios}"
                   class="gl-nav-link"
                   title="Laboratórios"
                   th:classappend="${menuAtivo == 'laboratorios'} ? ' active' : ''">
                    <i class="bi bi-door-open" aria-hidden="true"></i><span>Laboratórios</span>
                </a>
            </li>
        </ul>
    </nav>
</aside>

<header th:fragment="topbar(pageTitle)" class="gl-topbar">
    <button class="gl-topbar-toggle" id="sidebarToggle" aria-label="Abrir menu"><i class="bi bi-list"></i></button>
    <span class="gl-topbar-title" th:text="${pageTitle}">GestãoLab</span>
    <div class="gl-topbar-spacer"></div>
    <div class="gl-topbar-user">
        <i class="bi bi-person-circle" aria-hidden="true"></i>
        <a th:href="@{/meu-perfil}" class="gl-topbar-user-name"
           th:text="${session.nome ?: 'Usuário'}">Usuário</a>
        <span class="gl-topbar-role"
              th:text="${'(' + (session.perfil == 'COORDENADOR' ? 'Coordenador' : (session.perfil == 'PROFESSOR' ? 'Professor' : 'Usuário')) + ')'}">
            (Usuário)
        </span>
        <button type="button" class="gl-topbar-logout" title="Sair"
                data-modal-titulo="Sair do sistema"
                data-modal-msg="Deseja sair do sistema?"
                data-modal-confirma="Sair"
                data-modal-classe="btn-danger"
                data-modal-href="/logout"
                onclick="glAbrirModalHref(this)">
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
        </button>
    </div>
</header>

<th:block th:fragment="page-header(titulo, subtitulo, urlVoltar)">
    <div class="gl-page-header fade-in">
        <div class="gl-page-header-row">
            <a th:if="${urlVoltar != null}" th:href="${urlVoltar}" class="gl-btn-voltar" aria-label="Voltar">
                <i class="bi bi-arrow-left" aria-hidden="true"></i>
                <span>Voltar</span>
            </a>
            <div>
                <h1 class="gl-page-title" th:text="${titulo}">Título</h1>
                <p th:if="${subtitulo != null and !#strings.isEmpty(subtitulo)}"
                   class="gl-page-subtitle" th:text="${subtitulo}">Subtítulo</p>
            </div>
        </div>
    </div>
</th:block>

<th:block th:fragment="scripts">
    <input type="hidden" id="toast-success-message" th:if="${mensagemSucesso != null}" th:value="${mensagemSucesso}"/>
    <input type="hidden" id="toast-error-message" th:if="${errorMessage != null}" th:value="${errorMessage}"/>
    <!-- Modal de Confirmação reutilizável -->
    <div id="glModalConfirmacao"
         role="dialog" aria-modal="true" aria-labelledby="glModalConfirmacaoTitulo"
         style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:2000;align-items:center;justify-content:center;">
        <div class="gl-card" style="max-width:400px;width:90%;margin:0;z-index:2001;">
            <div class="gl-card-header">
                <span class="gl-card-title" id="glModalConfirmacaoTitulo">Confirmação</span>
            </div>
            <div class="gl-card-body">
                <p id="glModalConfirmacaoMsg" style="color:var(--gl-text-secondary);margin-bottom:20px;"></p>
                <div id="glModalMotivoWrapper" style="display:none;margin-bottom:16px;">
                    <label for="glModalMotivoInput" style="font-size:.875rem;color:var(--gl-text-secondary);display:block;margin-bottom:4px;">Motivo (opcional)</label>
                    <textarea id="glModalMotivoInput" rows="2" maxlength="255"
                              class="gl-form-control" placeholder="Motivo..."></textarea>
                </div>
                <div style="display:flex;gap:10px;justify-content:flex-end;">
                    <button type="button" id="glModalBtnCancelar" class="btn btn-outline"
                            onclick="glFecharModal()">Cancelar</button>
                    <button type="button" id="glModalBtnConfirmar" class="btn btn-primary"
                            onclick="glConfirmarModal()">Confirmar</button>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/gestaolab.js}"></script>
</th:block>
</body>
</html>
