spring.datasource.url=jdbc:h2:mem:gestaolab_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
api.security.token.secret=test-secret-gestaolab-0123456789012345678901234567890123456789
api.security.token.expiration-ms=86400000
api.security.session.inactivity-timeout-ms=1800000
app.upload.dir=uploads/arquivos
app.upload.dir.usuarios=uploads/usuarios
spring.task.scheduling.enabled=false
spring.main.lazy-initialization=false
