<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GestãoLab — Em Construção</title>
    <th:block th:replace="~{fragments/layout :: head-content}"></th:block>
</head>
<body>
<div class="gl-sidebar-overlay" id="sidebarOverlay"></div>
<div class="gl-wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="gl-main">
        <div th:replace="~{fragments/layout :: topbar('Em Construção')}"></div>
        <main class="gl-content" id="main-content">
            <div class="gl-page-header fade-in">
                <h1 class="gl-page-title">Em Construção</h1>
                <p class="gl-page-subtitle">Esta funcionalidade será disponibilizada em breve.</p>
            </div>
            <div class="gl-card fade-in delay-1" style="max-width:500px;">
                <div class="gl-card-body" style="text-align:center;padding:48px 24px;">
                    <i class="bi bi-tools" style="font-size:3rem;color:var(--gl-primary);margin-bottom:16px;display:block;"></i>
                    <p style="color:var(--gl-text-secondary);">
                        Estamos trabalhando para entregar esta funcionalidade.<br>
                        <a th:href="@{/dashboard}" class="btn btn-outline" style="margin-top:16px;">
                            <i class="bi bi-arrow-left"></i> Voltar ao Dashboard
                        </a>
                    </p>
                </div>
            </div>
        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
