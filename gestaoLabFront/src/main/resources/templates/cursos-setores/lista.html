<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GestãoLab — Cursos e Setores</title>
    <th:block th:replace="~{fragments/layout :: head-content}"></th:block>
</head>
<body>
<div class="gl-sidebar-overlay" id="sidebarOverlay"></div>
<div class="gl-wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="gl-main">
        <div th:replace="~{fragments/layout :: topbar('Cursos e Setores')}"></div>
        <main class="gl-content" id="main-content">
            <div th:replace="~{fragments/layout :: page-header('Cursos e Setores', 'Gerencie os cursos e setores vinculados ao laboratório.', ${urlVoltar})}"></div>

            <div class="gl-card fade-in" style="margin-bottom:20px;">
                <div class="gl-card-body">
                    <form method="get" th:action="@{/cursos-setores}" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
                        <div class="gl-form-group" style="flex:1;min-width:160px;margin-bottom:0;">
                            <label class="gl-form-label">Buscar por nome</label>
                            <input type="text" name="nome" class="gl-form-control" placeholder="Nome..."
                                   th:value="${filtroBusca}">
                        </div>
                        <div class="gl-form-group" style="min-width:130px;margin-bottom:0;">
                            <label class="gl-form-label">Situação</label>
                            <select name="ativo" class="gl-form-control">
                                <option value="">Todos</option>
                                <option value="true" th:selected="${filtroAtivo == true}">Ativo</option>
                                <option value="false" th:selected="${filtroAtivo == false}">Inativo</option>
                            </select>
                        </div>
                        <div class="gl-form-group" style="min-width:120px;margin-bottom:0;">
                            <label class="gl-form-label">Tipo</label>
                            <select name="tipo" class="gl-form-control">
                                <option value="">Todos</option>
                                <option value="CURSO" th:selected="${filtroTipo == 'CURSO'}">Curso</option>
                                <option value="SETOR" th:selected="${filtroTipo == 'SETOR'}">Setor</option>
                            </select>
                        </div>
                        <div style="display:flex;gap:8px;">
                            <button type="submit" class="btn btn-primary btn-sm">
                                <i class="bi bi-search" aria-hidden="true"></i> Filtrar
                            </button>
                            <a th:href="@{/cursos-setores}" class="btn btn-outline btn-sm">Limpar</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="gl-card fade-in delay-1">
                <div class="gl-card-header">
                    <span class="gl-card-title">
                        <i class="bi bi-journal-bookmark" aria-hidden="true"></i> Lista
                    </span>
                    <a th:href="@{/cursos-setores/novo}" class="btn btn-primary btn-sm">
                        <i class="bi bi-plus-lg" aria-hidden="true"></i> Novo
                    </a>
                </div>
                <div class="gl-card-body" style="padding:0;">
                    <div th:if="${cursos.isEmpty()}" style="padding:32px;text-align:center;color:var(--gl-text-muted);">
                        <i class="bi bi-inbox" aria-hidden="true" style="font-size:2rem;display:block;margin-bottom:8px;"></i>
                        Nenhum registro encontrado.
                    </div>
                    <div th:unless="${cursos.isEmpty()}" style="overflow-x:auto;">
                        <table class="gl-table">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Tipo</th>
                                    <th>Situação</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cs : ${cursos}">
                                    <td th:text="${cs.nome}">-</td>
                                    <td>
                                        <span class="gl-badge"
                                              th:classappend="${cs.tipo == 'CURSO'} ? ' gl-badge-info' : ' gl-badge-neutral'"
                                              th:text="${cs.tipo == 'CURSO'} ? 'Curso' : 'Setor'">-</span>
                                    </td>
                                    <td>
                                        <span class="gl-badge"
                                              th:classappend="${cs.ativo} ? ' gl-badge-success' : ' gl-badge-danger'"
                                              th:text="${cs.ativo} ? 'Ativo' : 'Inativo'">-</span>
                                    </td>
                                    <td>
                                        <div style="display:flex;gap:6px;">
                                            <a th:href="@{/cursos-setores/editar/{id}(id=${cs.id})}"
                                               class="btn btn-outline btn-sm" title="Editar">
                                                <i class="bi bi-pencil" aria-hidden="true"></i>
                                            </a>
                                            <form th:if="${cs.ativo}"
                                                  th:id="'form-inativar-cs-' + ${cs.id}"
                                                  th:action="@{/cursos-setores/{id}/inativar(id=${cs.id})}"
                                                  method="post" style="display:inline;">
                                                <button type="button" class="btn btn-sm"
                                                        style="background:var(--gl-danger-bg);color:var(--gl-danger);"
                                                        title="Inativar"
                                                        data-modal-titulo="Inativar registro"
                                                        data-modal-msg="Confirma a inativação deste registro?"
                                                        data-modal-confirma="Inativar"
                                                        data-modal-classe="btn-danger"
                                                        th:attr="data-modal-form='form-inativar-cs-' + ${cs.id}"
                                                        onclick="glAbrirModalForm(this)">
                                                    <i class="bi bi-slash-circle" aria-hidden="true"></i>
                                                </button>
                                            </form>
                                            <form th:unless="${cs.ativo}"
                                                  th:id="'form-reativar-cs-' + ${cs.id}"
                                                  th:action="@{/cursos-setores/{id}/reativar(id=${cs.id})}"
                                                  method="post" style="display:inline;">
                                                <button type="button" class="btn btn-sm"
                                                        style="background:var(--gl-success-bg);color:var(--gl-success);"
                                                        title="Reativar"
                                                        data-modal-titulo="Reativar registro"
                                                        data-modal-msg="Confirma a reativação deste registro?"
                                                        data-modal-confirma="Reativar"
                                                        data-modal-classe="btn-primary"
                                                        th:attr="data-modal-form='form-reativar-cs-' + ${cs.id}"
                                                        onclick="glAbrirModalForm(this)">
                                                    <i class="bi bi-check-circle" aria-hidden="true"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
