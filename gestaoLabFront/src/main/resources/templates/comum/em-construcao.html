<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title th:text="'GestãoLab — ' + (${tituloModulo} ?: 'Em Construção')">GestãoLab — Em Construção</title>
    <th:block th:replace="~{fragments/layout :: head-content}"></th:block>
</head>
<body>
<div class="gl-sidebar-overlay" id="sidebarOverlay"></div>
<div class="gl-wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="gl-main">
        <div th:replace="~{fragments/layout :: topbar(${tituloModulo ?: 'Em Construção'})}"></div>
        <main class="gl-content" id="main-content">
            <div th:replace="~{fragments/layout :: page-header(${tituloModulo ?: 'Em Construção'}, 'Esta funcionalidade será disponibilizada em breve.', ${urlVoltar})}"></div>
            <div class="gl-card fade-in delay-1" style="max-width:500px;">
                <div class="gl-card-body" style="text-align:center;padding:48px 24px;">
                    <i class="bi bi-eyedropper" style="font-size:3rem;color:var(--gl-primary);margin-bottom:16px;display:block;" aria-hidden="true"></i>
                    <p style="color:var(--gl-text-secondary);">
                        Estamos trabalhando para entregar esta funcionalidade.
                    </p>
                </div>
            </div>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
